<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .warp {
            width: 800px;
            height: 400px;
            border: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            /* 控制交叉轴的起始间距 */
            align-items: flex-start;
            justify-content: space-between;


        }


        .box {
            width: 150px;
            height: 150px;
            margin: 10px;
            background-color: #f00;

        }
        .empty {
            background-color: #fff;
        }
    </style>
</head>

<body>
    <div class="warp">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <!-- 占位符  因为四个为一组，可以补三个空位 形成一组-->
        <div class="box empty"></div>
        <div class="box empty"></div>
        <div class="box empty"></div>
    </div>
</body>

</html>
